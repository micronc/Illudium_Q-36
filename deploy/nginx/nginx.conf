worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    client_max_body_size 20m;

    # Sticky sessions: same client IP → same replica (keeps in-memory chat history coherent).
    # For cookie-based affinity at AWS ALB / GCP, enable stickiness on the load balancer instead.
    upstream illudium_backend {
        ip_hash;
        server illudium-q36:8080 max_fails=3 fail_timeout=30s;
        # Scale out by adding replicas, e.g.:
        # server illudium-q36-2:8080;
    }

    server {
        listen 8080;
        server_name _;

        location /healthz {
            proxy_pass http://illudium_backend/healthz;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://illudium_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            # SSE / streamed chat+briefing
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }
    }
}
